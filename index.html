<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stephen Chen — Credits</title>
<meta name="description" content="Saxophone, production, and writing credits across releases Stephen Chen has played or worked on, with Behaviorist and as a session and production collaborator.">
<style>
  :root {
    --paper: #faf9f6;
    --paper-raised: #f2efe6;
    --paper-sunken: #eeeadf;
    --ink: #2c2620;
    --ink-soft: #4a453a;
    --muted: #8a8371;
    --line: #e0dbcd;
    --line-strong: #cfc9ba;
    --accent: #8c5a26;
    --accent-strong: #6b4419;
    --accent-tint: #f1e4d0;
    --shadow: 0 12px 32px -12px rgba(44,38,32,0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17140f;
      --paper-raised: #211c15;
      --paper-sunken: #1c1811;
      --ink: #ece6d9;
      --ink-soft: #c9c0ac;
      --muted: #8f8770;
      --line: #383226;
      --line-strong: #4a4232;
      --accent: #e4b26a;
      --accent-strong: #f3d9a4;
      --accent-tint: #322a1b;
      --shadow: 0 12px 32px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --paper: #17140f;
    --paper-raised: #211c15;
    --paper-sunken: #1c1811;
    --ink: #ece6d9;
    --ink-soft: #c9c0ac;
    --muted: #8f8770;
    --line: #383226;
    --line-strong: #4a4232;
    --accent: #e4b26a;
    --accent-strong: #f3d9a4;
    --accent-tint: #322a1b;
    --shadow: 0 12px 32px -12px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding: 0 20px;
    padding-block: 28px 80px;
  }
  ::selection { background: var(--accent-tint); }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tabular { font-variant-numeric: tabular-nums; }

  .shell { max-width: 980px; margin: 0 auto; transition: max-width 0.15s ease; }
  .shell.has-detail { max-width: 1320px; }

  .topbar {
    padding-bottom: 22px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  .topbar h1 { font-size: 30px; font-weight: 600; }
  .topbar .sub { font-size: 13.5px; color: var(--muted); margin-top: 8px; max-width: 56ch; line-height: 1.5; }

  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: start; }
  .layout.has-detail { grid-template-columns: 200px minmax(0, 1fr) 380px; }
  @media (max-width: 1080px) {
    .layout.has-detail { grid-template-columns: 200px minmax(0, 1fr); }
    .layout.has-detail .detail { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .layout, .layout.has-detail { grid-template-columns: 1fr; }
    .sidebar { position: static !important; }
    .layout.has-detail .detail { grid-column: auto; }
  }

  .sidebar { position: sticky; top: 20px; }
  .sidebar .cat { margin-bottom: 14px; }
  .sidebar .cat-head {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    padding: 4px 0; user-select: none;
  }
  .sidebar .cat-head svg { flex: 0 0 auto; transition: transform 0.15s ease; }
  .sidebar .cat-head.collapsed svg { transform: rotate(-90deg); }
  .role-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 13px;
  }
  .role-row input { accent-color: var(--accent); width: 14px; height: 14px; }
  .role-row .ic {
    width: 18px; height: 18px; border-radius: 50%; background: var(--paper-sunken); color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .clear-filters { margin-top: 4px; }
  .btn-text { background: none; border: none; color: var(--muted); padding: 6px 8px; font-size: 12.5px; cursor: pointer; }
  .btn-text:hover { color: var(--accent); }

  .release-count { font-size: 12px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .sort-control { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .sort-label { color: var(--muted); margin-right: 2px; }
  .sort-btn {
    background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px;
    display: inline-flex; align-items: center; gap: 3px; padding: 3px 6px; border-radius: 4px;
  }
  .sort-btn:hover { color: var(--ink); }
  .sort-btn.active { color: var(--accent); font-weight: 600; }
  .sort-btn svg { transition: transform 0.15s ease; }
  .sort-btn.dir-asc svg { transform: rotate(180deg); }
  .refresh-btn {
    background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px;
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px;
  }
  .refresh-btn:hover { color: var(--accent); }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .release { border-bottom: 1px solid var(--line); }
  .release-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 4px 14px 12px; cursor: pointer;
    border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
  }
  .release-row:hover { background: var(--paper-raised); }
  .release-row.active { background: var(--accent-tint); border-left-color: var(--accent); }
  .caret { flex: 0 0 16px; color: var(--muted); }

  .art {
    position: relative; flex: 0 0 46px; width: 46px; height: 46px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px;
    overflow: hidden; color: var(--paper);
  }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art .play-overlay {
    position: absolute; inset: 0; background: rgba(20,17,13,0.5);
    display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s ease;
  }
  .art:hover .play-overlay { opacity: 1; }

  .release-meta { flex: 1 1 auto; min-width: 0; }
  .release-meta .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .release-meta .line { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .pills-album { flex: 0 0 120px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { border-radius: 50%; background: var(--paper-sunken); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; }
  .pill-album { width: 20px; height: 20px; }

  .play-btn {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--paper);
  }

  .detail {
    position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 22px;
  }
  .detail-empty {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px;
    border: 1px dashed var(--line-strong); border-radius: 10px;
  }
  .detail-close {
    float: right; background: none; border: none; cursor: pointer; color: var(--muted); padding: 2px;
    display: inline-flex; margin-left: 12px;
  }
  .detail-close:hover { color: var(--ink); }
  .detail-art {
    width: 100%; aspect-ratio: 1; border-radius: 8px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; color: var(--paper);
  }
  .detail-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .detail-title { font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 600; margin-top: 16px; text-wrap: balance; }
  .detail-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .detail-links { display: flex; gap: 10px; margin-top: 16px; }
  .detail-desc {
    font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); margin-top: 20px; white-space: pre-wrap;
  }
  .detail-embed { margin-top: 20px; border-radius: 12px; overflow: hidden; }
  .detail-embed iframe { display: block; width: 100%; border: 0; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--line-strong); border-radius: 10px; margin-top: 12px;
  }

  .banner {
    background: var(--accent-tint); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 12px 16px; font-size: 13px; color: var(--ink-soft); margin-bottom: 20px;
  }

  .pop-overlay { position: fixed; inset: 0; z-index: 40; }
  .pop-card {
    position: fixed; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow); z-index: 41; padding: 16px;
  }
  .pop-card .pop-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .pop-card .pop-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; }
  .pop-close { background: none; border: none; cursor: pointer; color: var(--muted); flex: 0 0 auto; }
  .pop-close:hover { color: var(--ink); }
  .pop-links { display: flex; gap: 10px; }
  .pop-link {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-soft);
    font-size: 11px;
  }
  .pop-link .badge {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--paper);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
  }
  .pop-link:hover .badge { background: var(--accent-strong); }

  svg { display: block; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="topbar">
    <div class="eyebrow">Stephen Chen</div>
    <h1>Credits</h1>
    <div class="sub">Saxophone, production, and writing credits across releases I’ve played or worked on — with Behaviorist and as a session and production collaborator. Filter by role, or open a release for more details and a listen.</div>
  </div>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="main"></main>
    <aside class="detail" id="detail"></aside>
  </div>
</div>

<div id="overlay-slot"></div>

<script src="vendor/xlsx.core.min.js"></script>
<script>
(function () {
  "use strict";

  var RELEASES = [];

  // ---------- role / icon registry (matches the Credits Desk glyph set) ----------
  var ROLES = [
    { key: "saxophone", label: "Saxophone", category: "Performance",
      icon: '<path d="M9 3v6c0 5 4 6 4 10a2 2 0 1 1-4 0"/><circle cx="9" cy="3" r="1" fill="currentColor" stroke="none"/>' },
    { key: "vocals", label: "Vocals", category: "Performance",
      icon: '<rect x="9" y="3" width="6" height="10" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/>' },
    { key: "keyboards", label: "Keyboards", category: "Performance",
      icon: '<rect x="3" y="5" width="18" height="14" rx="1"/><line x1="8" y1="5" x2="8" y2="13"/><line x1="13" y1="5" x2="13" y2="13"/><line x1="16" y1="5" x2="16" y2="13"/>' },
    { key: "flute", label: "Flute", category: "Performance",
      icon: '<circle cx="4" cy="12" r="1.6"/><line x1="6" y1="12" x2="21" y2="12"/><circle cx="9" cy="12" r="0.8" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="0.8" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="0.8" fill="currentColor" stroke="none"/>' },
    { key: "clarinet", label: "Clarinet", category: "Performance",
      icon: '<line x1="12" y1="3" x2="12" y2="17"/><path d="M9 17 L12 21 L15 17 Z"/><circle cx="12" cy="6" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="9.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="0.8" fill="currentColor" stroke="none"/>' },
    { key: "drums", label: "Drums", category: "Performance",
      icon: '<rect x="5" y="10" width="14" height="8" rx="2"/><line x1="6" y1="14" x2="15" y2="5"/><line x1="18" y1="14" x2="9" y2="5"/>' },
    { key: "bass", label: "Bass", category: "Performance",
      icon: '<rect x="3" y="13" width="7" height="7" rx="2"/><line x1="9" y1="14" x2="20" y2="4"/><line x1="17" y1="6" x2="19" y2="8"/>' },
    { key: "arranging", label: "Arranging", category: "Production",
      icon: '<line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="11" x2="21" y2="11"/><line x1="3" y1="15" x2="21" y2="15"/><circle cx="9" cy="18" r="2" fill="currentColor" stroke="none"/><line x1="11" y1="18" x2="11" y2="8"/><circle cx="16" cy="19" r="2" fill="currentColor" stroke="none"/><line x1="18" y1="19" x2="18" y2="9"/>' },
    { key: "engineering", label: "Engineering", category: "Production",
      icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>' },
    { key: "mixing", label: "Mixing", category: "Production",
      icon: '<line x1="6" y1="4" x2="6" y2="20"/><rect x="4" y="9" width="4" height="3" rx="1"/><line x1="12" y1="4" x2="12" y2="20"/><rect x="10" y="14" width="4" height="3" rx="1"/><line x1="18" y1="4" x2="18" y2="20"/><rect x="16" y="6" width="4" height="3" rx="1"/>' },
    { key: "producing", label: "Producing", category: "Production",
      icon: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>' },
    { key: "writing", label: "Writing", category: "Writing",
      icon: '<path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><line x1="14" y1="7" x2="17" y2="10"/>' }
  ];
  var ROLE_BY_KEY = {};
  ROLES.forEach(function (r) { ROLE_BY_KEY[r.key] = r; });
  var CATEGORIES = ["Performance", "Production", "Writing"];

  function iconSvg(role, size) {
    size = size || 12;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + role.icon + '</svg>';
  }

  var ART_TILES = ["#8c5a26", "#5c6b4a", "#4a5566", "#7a4a5a", "#6b5842", "#4f6b5f"];
  function tileColor(seed) {
    var h = 0;
    for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return ART_TILES[h % ART_TILES.length];
  }
  function initials(name) {
    var words = name.replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "?";
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- state (read-only: no drawer, no edit/delete) ----------
  var state = {
    releases: RELEASES,
    selectedRoles: {},
    collapsedCategories: {},
    selectedReleaseId: null,
    listenPop: null,
    loading: true,
    loadError: null,
    sortField: "date",
    sortDir: "desc"
  };

  function setState(patch) {
    Object.assign(state, patch);
    render();
  }

  function positionPopover(e, cardWidth, cardHeight) {
    var rect = e.currentTarget.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = rect.left;
    var top = rect.bottom + 8;
    if (left + cardWidth > vw - 12) left = Math.max(12, vw - cardWidth - 12);
    if (top + cardHeight > vh - 12) {
      var above = rect.top - cardHeight - 8;
      top = above > 12 ? above : Math.max(12, vh - cardHeight - 12);
    }
    return { top: top, left: left };
  }

  // ---------- filtering ----------
  function activeRoleKeys() {
    return Object.keys(state.selectedRoles).filter(function (k) { return state.selectedRoles[k]; });
  }
  function trackMatches(track, active) {
    if (!active.length) return true;
    return (track.roles || []).some(function (r) { return active.indexOf(r) !== -1; });
  }
  function releaseVisible(release, active) {
    if (!active.length) return true;
    return (release.tracks || []).some(function (t) { return trackMatches(t, active); });
  }

  // ---------- sorting ----------
  function sortReleases(releases) {
    var field = state.sortField, dir = state.sortDir === "asc" ? 1 : -1;
    var sorted = releases.slice();
    sorted.sort(function (a, b) {
      var cmp;
      if (field === "name") {
        cmp = String(a.album || "").localeCompare(String(b.album || ""));
      } else {
        cmp = (Number(a.year) || 0) - (Number(b.year) || 0);
      }
      return cmp * dir;
    });
    return sorted;
  }

  // ---------- sidebar ----------
  function renderSidebar() {
    var active = activeRoleKeys();
    var html = "";
    if (active.length) {
      html += '<button class="btn-text clear-filters" id="clear-filters">Clear filters (' + active.length + ')</button>';
    }
    CATEGORIES.forEach(function (cat) {
      var collapsed = !!state.collapsedCategories[cat];
      html += '<div class="cat">';
      html += '<div class="cat-head' + (collapsed ? " collapsed" : "") + '" data-cat="' + cat + '">';
      html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
      html += cat + '</div>';
      if (!collapsed) {
        ROLES.filter(function (r) { return r.category === cat; }).forEach(function (r) {
          var checked = !!state.selectedRoles[r.key];
          html += '<label class="role-row" data-role="' + r.key + '">';
          html += '<input type="checkbox" data-role-cb="' + r.key + '"' + (checked ? " checked" : "") + '>';
          html += '<span class="ic">' + iconSvg(r, 11) + '</span>' + r.label;
          html += '</label>';
        });
      }
      html += '</div>';
    });
    document.getElementById("sidebar").innerHTML = html;

    document.querySelectorAll(".cat-head").forEach(function (el) {
      el.addEventListener("click", function () {
        var cat = el.getAttribute("data-cat");
        var next = Object.assign({}, state.collapsedCategories);
        next[cat] = !next[cat];
        setState({ collapsedCategories: next });
      });
    });
    document.querySelectorAll("[data-role-cb]").forEach(function (el) {
      el.addEventListener("change", function () {
        var key = el.getAttribute("data-role-cb");
        var scrollY = window.scrollY;
        var next = Object.assign({}, state.selectedRoles);
        next[key] = el.checked;
        setState({ selectedRoles: next });
        requestAnimationFrame(function () { window.scrollTo(0, scrollY); });
      });
    });
    var clearBtn = document.getElementById("clear-filters");
    if (clearBtn) clearBtn.addEventListener("click", function () { setState({ selectedRoles: {} }); });
  }

  // ---------- pills ----------
  function pillsHtml(roles) {
    var html = '<div class="pills-album">';
    (roles || []).slice().sort().forEach(function (key) {
      var r = ROLE_BY_KEY[key];
      if (!r) return;
      html += '<span class="pill pill-album" title="' + escapeHtml(r.label) + '">' + iconSvg(r, 13) + '</span>';
    });
    html += '</div>';
    return html;
  }

  function artHtml(release) {
    var art = release.artworkUrl
      ? '<img src="' + escapeHtml(release.artworkUrl) + '" alt="" onerror="this.remove()">'
      : "";
    var bg = release.artworkUrl ? "" : tileColor(release.album || release.id);
    var hasListen = release.bandcamp || release.spotify || release.youtube;
    var overlay = hasListen
      ? '<div class="play-overlay"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ffffff"><polygon points="6,4 20,12 6,20"></polygon></svg></div>'
      : "";
    return '<div class="art" data-listen="' + release.id + '" style="' + (bg ? "background:" + bg + ";" : "") + '">' +
      (release.artworkUrl ? "" : initials(release.album || "")) + art + overlay + '</div>';
  }

  // ---------- main list ----------
  function renderMain() {
    var main = document.getElementById("main");

    if (state.loading) {
      main.innerHTML = '<div class="empty-state">Loading credits…</div>';
      return;
    }
    if (state.loadError) {
      main.innerHTML = '<div class="empty-state">Couldn’t load data/credits.xlsx: ' + escapeHtml(state.loadError) + '</div>';
      return;
    }

    var active = activeRoleKeys();
    var visible = sortReleases(state.releases.filter(function (r) { return releaseVisible(r, active); }));

    var arrow = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
    var html = '<div class="release-count tabular">' + visible.length + ' release' + (visible.length === 1 ? "" : "s") +
      (active.length ? " matching filter" : "") + '<div class="sort-control"><span class="sort-label">Sort</span>' +
      ["date", "name"].map(function (f) {
        var isActive = state.sortField === f;
        return '<button class="sort-btn' + (isActive ? " active" : "") + (isActive && state.sortDir === "asc" ? " dir-asc" : "") +
          '" data-sort-field="' + f + '">' + (f === "date" ? "Date" : "Name") + (isActive ? arrow : "") + '</button>';
      }).join("") + '</div></div>';

    if (!visible.length) {
      html += '<div class="empty-state">' + (state.releases.length ? "No releases match that filter." : "Nothing here yet.") + '</div>';
      main.innerHTML = html;
      return;
    }

    visible.forEach(function (release) {
      var isActive = state.selectedReleaseId === release.id;
      var meta = [release.artist, release.year].filter(Boolean).join(" · ");
      html += '<div class="release" data-release="' + release.id + '">';
      html += '<div class="release-row' + (isActive ? " active" : "") + '" data-toggle="' + release.id + '">';
      html += '<svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';
      html += artHtml(release);
      html += '<div class="release-meta"><div class="name">' + escapeHtml(release.album) + '</div><div class="line">' + escapeHtml(meta) + '</div></div>';
      html += pillsHtml(uniqueAlbumRoles(release));
      html += '</div>';
      html += '</div>';
    });

    main.innerHTML = html;
    wireMainEvents();
  }

  // ---------- detail panel ----------
  function spotifyEmbedUrl(url) {
    return url.replace("open.spotify.com/", "open.spotify.com/embed/");
  }

  function renderDetail() {
    var layout = document.getElementById("layout");
    var shell = document.getElementById("shell");
    var detail = document.getElementById("detail");
    var release = state.releases.find(function (r) { return r.id === state.selectedReleaseId; });

    layout.classList.toggle("has-detail", !!release);
    shell.classList.toggle("has-detail", !!release);

    if (!release) {
      detail.innerHTML = '<div class="detail-empty">Select a release to see more.</div>';
      return;
    }

    var meta = [release.artist, release.year].filter(Boolean).join(" · ");
    var art = release.artworkUrl
      ? '<img src="' + escapeHtml(release.artworkUrl) + '" alt="" onerror="this.remove()">'
      : "";
    var bg = release.artworkUrl ? "" : tileColor(release.album || release.id);

    var html = '<button class="detail-close" id="detail-close" title="Close">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>';
    html += '<div class="detail-art" style="' + (bg ? "background:" + bg + ";" : "") + '">' +
      (release.artworkUrl ? "" : initials(release.album || "")) + art + '</div>';
    html += '<div class="detail-title">' + escapeHtml(release.album) + '</div>';
    html += '<div class="detail-meta">' + escapeHtml(meta) + '</div>';

    if (release.bandcamp || release.spotify || release.youtube) {
      html += '<div class="detail-links">';
      if (release.bandcamp) html += '<a class="pop-link" href="' + escapeHtml(release.bandcamp) + '" target="_blank" rel="noopener"><span class="badge">BC</span>Bandcamp</a>';
      if (release.spotify) html += '<a class="pop-link" href="' + escapeHtml(release.spotify) + '" target="_blank" rel="noopener"><span class="badge">SP</span>Spotify</a>';
      if (release.youtube) html += '<a class="pop-link" href="' + escapeHtml(release.youtube) + '" target="_blank" rel="noopener"><span class="badge">YT</span>YouTube</a>';
      html += '</div>';
    }

    html += '<div class="detail-desc">' + (escapeHtml(release.description) || '<em style="color:var(--muted)">No notes yet.</em>') + '</div>';

    if (release.spotify) {
      html += '<div class="detail-embed"><iframe src="' + escapeHtml(spotifyEmbedUrl(release.spotify)) +
        '" width="100%" height="152" frameborder="0" allowfullscreen ' +
        'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>';
    }

    detail.innerHTML = html;
    var closeBtn = document.getElementById("detail-close");
    if (closeBtn) closeBtn.addEventListener("click", function () { setState({ selectedReleaseId: null }); });
  }

  function uniqueAlbumRoles(release) {
    var set = {};
    (release.tracks || []).forEach(function (t) { (t.roles || []).forEach(function (r) { set[r] = true; }); });
    return Object.keys(set);
  }

  function wireMainEvents() {
    document.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-listen]")) return;
        var id = el.getAttribute("data-toggle");
        setState({ selectedReleaseId: state.selectedReleaseId === id ? null : id });
      });
    });
    document.querySelectorAll("[data-listen]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-listen");
        var release = state.releases.find(function (r) { return r.id === id; });
        if (!release || !(release.bandcamp || release.spotify || release.youtube)) return;
        var pos = positionPopover(e, 220, 110);
        setState({ listenPop: { title: release.album, bandcamp: release.bandcamp, spotify: release.spotify, youtube: release.youtube, top: pos.top, left: pos.left } });
      });
    });
    document.querySelectorAll("[data-sort-field]").forEach(function (el) {
      el.addEventListener("click", function () {
        var field = el.getAttribute("data-sort-field");
        if (state.sortField === field) {
          setState({ sortDir: state.sortDir === "asc" ? "desc" : "asc" });
        } else {
          setState({ sortField: field, sortDir: field === "name" ? "asc" : "desc" });
        }
      });
    });
  }

  // ---------- popovers ----------
  function renderOverlays() {
    var slot = document.getElementById("overlay-slot");
    var html = "";

    if (state.listenPop) {
      var l = state.listenPop;
      html += '<div class="pop-overlay" id="listen-overlay"></div>';
      html += '<div class="pop-card" style="top:' + l.top + 'px; left:' + l.left + 'px;">' +
        '<div class="pop-head"><div class="pop-title">' + escapeHtml(l.title) + '</div>' +
        '<button class="pop-close" id="listen-close">&times;</button></div><div class="pop-links">';
      if (l.bandcamp) html += '<a class="pop-link" href="' + escapeHtml(l.bandcamp) + '" target="_blank" rel="noopener"><span class="badge">BC</span>Bandcamp</a>';
      if (l.spotify) html += '<a class="pop-link" href="' + escapeHtml(l.spotify) + '" target="_blank" rel="noopener"><span class="badge">SP</span>Spotify</a>';
      if (l.youtube) html += '<a class="pop-link" href="' + escapeHtml(l.youtube) + '" target="_blank" rel="noopener"><span class="badge">YT</span>YouTube</a>';
      html += '</div></div>';
    }

    slot.innerHTML = html;

    var lo = document.getElementById("listen-overlay"); if (lo) lo.addEventListener("click", function () { setState({ listenPop: null }); });
    var lc = document.getElementById("listen-close"); if (lc) lc.addEventListener("click", function () { setState({ listenPop: null }); });
  }

  // ---------- render root ----------
  function render() {
    var active = document.activeElement;
    var activeId = active && active.id;
    renderSidebar();
    renderMain();
    renderDetail();
    renderOverlays();
    if (activeId) {
      var el = document.getElementById(activeId);
      if (el && el !== document.activeElement) el.focus();
    }
  }

  // ---------- data loading ----------
  function buildReleases(workbook) {
    var relSheet = workbook.Sheets["Releases"];
    var trkSheet = workbook.Sheets["Tracks"];
    if (!relSheet || !trkSheet) {
      throw new Error("workbook must have \"Releases\" and \"Tracks\" sheets");
    }
    var relRows = XLSX.utils.sheet_to_json(relSheet, { defval: "" });
    var trkRows = XLSX.utils.sheet_to_json(trkSheet, { defval: "" });

    var tracksByRelease = {};
    trkRows.forEach(function (row) {
      var rid = String(row.release_id || "").trim();
      if (!rid) return;
      var roles = String(row.roles || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      (tracksByRelease[rid] = tracksByRelease[rid] || []).push({
        song: String(row.song || ""),
        roles: roles,
        notes: String(row.notes || "")
      });
    });

    return relRows.map(function (row) {
      var id = String(row.id || "").trim();
      return {
        id: id,
        album: String(row.album || ""),
        artist: String(row.artist || ""),
        description: String(row.description || ""),
        bandcamp: String(row.bandcamp || ""),
        spotify: String(row.spotify || ""),
        youtube: String(row.youtube || ""),
        year: row.year || "",
        createdAt: row.createdAt || 0,
        tracks: tracksByRelease[id] || []
      };
    }).filter(function (r) { return r.id; });
  }

  function loadData() {
    fetch("data/credits.xlsx")
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.arrayBuffer();
      })
      .then(function (buf) {
        state.releases = buildReleases(XLSX.read(buf, { type: "array" }));
        state.loading = false;
        render();
      })
      .catch(function (err) {
        state.loading = false;
        state.loadError = (err && err.message) || String(err);
        render();
      });
  }

  render();
  loadData();
})();
</script>
</body>
</html>
